<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排隊拎飛系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- HTML5-QRCode -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <!-- Firebase App & Database (v9 Compatibility) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

  <script>
    const FIREBASE_DB_URL = "https://hairticketing-default-rtdb.asia-southeast1.firebasedatabase.app/";

    let db = null;
    if (FIREBASE_DB_URL) {
      firebase.initializeApp({ databaseURL: FIREBASE_DB_URL });
      db = firebase.database();
    }
  </script>

  <!-- 選擇角色頁面 -->
  <div id="role-select" class="max-w-md mx-auto pt-20 px-4 text-center">
    <h1 class="text-3xl font-bold mb-8 text-slate-800">排隊拎飛系統</h1>
    <div class="space-y-4">
      <button onclick="initStore()" class="w-full py-4 bg-blue-600 text-white font-bold rounded-xl text-lg shadow-lg hover:bg-blue-700">
        🏪 我是店家 (開啟主控台)
      </button>
      <button onclick="initCustomer()" class="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl text-lg shadow-lg hover:bg-emerald-700">
        📱 我是客人 (掃碼拎飛)
      </button>
    </div>
  </div>

  <!-- ================= 店家端介面 ================= -->
  <div id="store-ui" class="hidden max-w-2xl mx-auto p-4">
    <!-- 設定區 -->
    <div id="store-setup" class="bg-white p-6 rounded-2xl shadow-md mb-6">
      <h2 class="text-xl font-bold mb-4 text-slate-800">🏪 店家基本設定</h2>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">鋪頭名稱</label>
          <input type="text" id="store-name-input" value="" placeholder="請輸入鋪頭名稱" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">拎飛開始時間</label>
            <input type="time" id="start-time-input" value="10:00" onchange="autoUpdateEndTime()" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">拎飛結束時間</label>
            <input type="time" id="end-time-input" value="20:00" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
          </div>
        </div>
        <button onclick="saveStoreSettings()" class="w-full py-3 bg-blue-600 text-white font-bold rounded-lg shadow hover:bg-blue-700">
          儲存並啟動拎飛服務
        </button>
        <button onclick="createNewStoreSession()" class="w-full py-2 bg-slate-200 text-slate-600 font-medium rounded-lg text-sm hover:bg-slate-300">
          🔄 開新鋪頭 / 重置全新 Wait List
        </button>
      </div>
    </div>

    <!-- 主控台 -->
    <div id="store-dashboard" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl shadow-md text-center">
        <div class="flex items-center justify-center gap-2 mb-2">
          <h2 id="display-store-name" class="text-2xl font-bold text-slate-800"></h2>
          <span class="inline-block w-3 h-3 bg-emerald-500 rounded-full animate-pulse" title="雲端連線正常"></span>
        </div>
        
        <!-- QR Code 顯示區 -->
        <div class="flex justify-center my-4">
          <div id="qrcode-container" class="p-4 bg-white border-2 border-slate-200 rounded-xl"></div>
        </div>
        <p class="text-xs text-gray-500">請客人開啟本網頁並掃描此 QR Code</p>
      </div>

      <!-- 叫號控制 -->
      <div class="bg-white p-6 rounded-2xl shadow-md text-center">
        <p class="text-gray-500 mb-1">目前叫飛號碼</p>
        <div id="current-called-num" class="text-6xl font-black text-blue-600 my-2">0000</div>
        <div class="flex gap-4 mt-6">
          <button onclick="nextTicket()" class="flex-1 py-4 bg-blue-600 text-white font-bold rounded-xl text-xl shadow hover:bg-blue-700">
            📢 叫下一位
          </button>
        </div>
      </div>

      <!-- 等候清單 -->
      <div class="bg-white p-6 rounded-2xl shadow-md">
        <h3 class="text-lg font-bold mb-4 text-slate-800">📋 等候中清單</h3>
        <div class="overflow-x-auto">
          <table class="w-full text-left">
            <thead>
              <tr class="border-b text-gray-500 text-sm">
                <th class="pb-2">飛號</th>
                <th class="pb-2">姓名</th>
                <th class="pb-2">人數</th>
                <th class="pb-2">電話</th>
                <th class="pb-2">時間</th>
              </tr>
            </thead>
            <tbody id="ticket-list" class="divide-y text-slate-700">
              <!-- 動態渲染 -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= 客人端介面 ================= -->
  <div id="customer-ui" class="hidden max-w-md mx-auto p-4">
    <!-- 掃描器 -->
    <div id="scanner-section" class="bg-white p-6 rounded-2xl shadow-md text-center">
      <h2 class="text-xl font-bold mb-4 text-slate-800">請掃描鋪頭 QR Code</h2>
      <div id="qr-reader" class="w-full rounded-lg overflow-hidden"></div>
    </div>

    <!-- 拎飛表單 -->
    <div id="ticket-form-section" class="hidden bg-white p-6 rounded-2xl shadow-md space-y-4">
      <h2 id="cust-store-name" class="text-xl font-bold text-slate-800 text-center"></h2>
      
      <div class="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl text-center">
        <div>
          <p class="text-xs text-gray-500">目前叫到</p>
          <p id="cust-current-num" class="text-2xl font-bold text-blue-600">----</p>
        </div>
        <div>
          <p class="text-xs text-gray-500">下張飛號</p>
          <p id="cust-next-num" class="text-2xl font-bold text-emerald-600">----</p>
        </div>
      </div>

      <div id="closed-msg" class="hidden p-4 bg-red-100 text-red-700 rounded-xl text-center font-bold">
        🚫 目前非拎飛時間
      </div>

      <div id="form-body" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700">姓名 (選填)</label>
          <input type="text" id="cust-name" placeholder="請輸入名字/稱呼" class="mt-1 block w-full border border-gray-300 rounded-md p-3 text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">人數</label>
          <select id="party-size" class="mt-1 block w-full border border-gray-300 rounded-md p-3 text-lg">
            <option value="1" selected>1 人</option>
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4">4 人</option>
            <option value="5+">5 人或以上</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700">電話號碼</label>
          <input type="tel" id="cust-phone" placeholder="輸入8位數字" class="mt-1 block w-full border border-gray-300 rounded-md p-3 text-lg">
        </div>
        <button onclick="submitTakeTicket()" class="w-full py-4 bg-emerald-600 text-white font-bold rounded-xl text-lg shadow hover:bg-emerald-700">
          確認拎飛
        </button>
      </div>
    </div>

    <!-- 成功取得票號顯示 -->
    <div id="ticket-result-section" class="hidden bg-white p-6 rounded-2xl shadow-md text-center space-y-4">
      <h2 class="text-lg text-gray-600">拎飛成功！你的飛號為</h2>
      <div id="my-ticket-num" class="text-6xl font-black text-emerald-600 my-4">0000</div>
      <div class="bg-slate-50 p-4 rounded-xl text-center">
        <p class="text-xs text-gray-500">目前現場叫號</p>
        <p id="cust-live-called-num" class="text-3xl font-bold text-blue-600">0000</p>
      </div>
      <p class="text-sm text-gray-500">請留意叫號更新，你可以離場等候</p>
    </div>
  </div>

  <script>
    let storeId = '';
    let storeData = {
      storeName: '',
      startTime: '',
      endTime: '',
      currentCalled: '0000',
      lastIssued: '0000',
      lastResetDate: '',
      tickets: []
    };

    function maskPhoneNumber(phone) {
      if (!phone || phone.length < 8) return phone;
      return '******' + phone.slice(-2);
    }

    function autoUpdateEndTime() {
      const startVal = document.getElementById('start-time-input').value;
      if (!startVal) return;
      const [hours, minutes] = startVal.split(':').map(Number);
      const endHours = (hours + 10) % 24;
      document.getElementById('end-time-input').value = `${endHours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    }

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const sid = urlParams.get('sid');
      if (sid) {
        initCustomerWithSid(sid);
      }
    };

    function initStore() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('store-ui').classList.remove('hidden');
      
      const saved = localStorage.getItem('p2p_queue_store_data');
      if (saved) {
        storeData = JSON.parse(saved);
        document.getElementById('store-name-input').value = storeData.storeName || '';
        document.getElementById('start-time-input').value = storeData.startTime || '10:00';
        document.getElementById('end-time-input').value = storeData.endTime || '20:00';
      }

      let savedSid = localStorage.getItem('p2p_queue_store_id');
      if (!savedSid) {
        savedSid = 'store_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('p2p_queue_store_id', savedSid);
      }
      storeId = savedSid;
    }

    function createNewStoreSession() {
      if (confirm('確定要開新鋪頭/重置全新 Wait List？這會產生新的 QR Code！')) {
        localStorage.removeItem('p2p_queue_store_id');
        localStorage.removeItem('p2p_queue_store_data');
        storeId = 'store_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('p2p_queue_store_id', storeId);
        
        storeData = {
          storeName: '',
          startTime: '10:00',
          endTime: '20:00',
          currentCalled: '0000',
          lastIssued: '0000',
          lastResetDate: new Date().toISOString().split('T')[0],
          tickets: []
        };
        document.getElementById('store-name-input').value = '';
        alert('已成功重置！請重新輸入鋪頭名稱並儲存。');
      }
    }

    function saveStoreSettings() {
      const nameInput = document.getElementById('store-name-input').value.trim();
      if (!nameInput) {
        alert('請輸入鋪頭名稱');
        return;
      }

      storeData.storeName = nameInput;
      storeData.startTime = document.getElementById('start-time-input').value;
      storeData.endTime = document.getElementById('end-time-input').value;
      
      checkDailyReset();
      syncToFirebase();

      document.getElementById('store-setup').classList.add('hidden');
      document.getElementById('store-dashboard').classList.remove('hidden');
      document.getElementById('display-store-name').innerText = storeData.storeName;

      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(()=>{});
      }

      generateStoreQRCode();

      db.ref('stores/' + storeId).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          storeData = val;
          saveToLocalStorage();
          renderDashboard();
        }
      });
    }

    function generateStoreQRCode() {
      const baseUrl = window.location.href.split('?')[0];
      const targetUrl = `${baseUrl}?sid=${storeId}`;

      const qrContainer = document.getElementById('qrcode-container');
      qrContainer.innerHTML = '';
      new QRCode(qrContainer, {
        text: targetUrl,
        width: 200,
        height: 200
      });
    }

    function calculateNextTicketNum(lastNum) {
      let num = parseInt(lastNum || '0', 10) + 1;
      if (num > 9999) num = 1;
      return num.toString().padStart(4, '0');
    }

    function checkDailyReset() {
      const today = new Date().toISOString().split('T')[0];
      if (storeData.lastResetDate !== today) {
        storeData.lastIssued = '0000';
        storeData.currentCalled = '0000';
        storeData.tickets = [];
        storeData.lastResetDate = today;
        syncToFirebase();
      }
    }

    function isTimeAllowed(start, end) {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const [sH, sM] = start.split(':').map(Number);
      const [eH, eM] = end.split(':').map(Number);
      const startMin = sH * 60 + sM;
      const endMin = eH * 60 + eM;

      if (endMin < startMin) {
        return currentMin >= startMin || currentMin <= endMin;
      }
      return currentMin >= startMin && currentMin <= endMin;
    }

    function nextTicket() {
      const waitingTickets = (storeData.tickets || []).filter(t => t.status === 'waiting');
      if (waitingTickets.length > 0) {
        const next = waitingTickets[0];
        next.status = 'called';
        storeData.currentCalled = next.ticketNum;
      } else {
        storeData.currentCalled = calculateNextTicketNum(storeData.currentCalled);
      }
      syncToFirebase();
    }

    function saveToLocalStorage() {
      localStorage.setItem('p2p_queue_store_data', JSON.stringify(storeData));
    }

    function syncToFirebase() {
      saveToLocalStorage();
      if (db && storeId) {
        db.ref('stores/' + storeId).set(storeData);
      }
    }

    function renderDashboard() {
      document.getElementById('current-called-num').innerText = storeData.currentCalled || '0000';
      const listElem = document.getElementById('ticket-list');
      listElem.innerHTML = (storeData.tickets || []).map(t => `
        <tr class="${t.status === 'called' ? 'bg-blue-50 font-bold' : ''}">
          <td class="py-3 text-lg text-blue-600">${t.ticketNum}</td>
          <td class="py-3">${t.name || '-'}</td>
          <td class="py-3">${t.partySize} 人</td>
          <td class="py-3">${maskPhoneNumber(t.phone)}</td>
          <td class="py-3 text-gray-400 text-sm">${t.time}</td>
        </tr>
      `).join('');
    }

    // ================= 客人端邏輯 =================
    function initCustomer() {
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('customer-ui').classList.remove('hidden');

      const html5QrcodeScanner = new Html5QrcodeScanner("qr-reader", { fps: 10, qrbox: 250 });
      html5QrcodeScanner.render((decodedText) => {
        html5QrcodeScanner.clear();
        window.location.href = decodedText;
      });
    }

    function initCustomerWithSid(sid) {
      storeId = sid;
      document.getElementById('role-select').classList.add('hidden');
      document.getElementById('customer-ui').classList.remove('hidden');
      document.getElementById('scanner-section').classList.add('hidden');

      const today = new Date().toISOString().split('T')[0];
      const savedDate = localStorage.getItem('my_ticket_date_' + storeId);
      const savedTicket = localStorage.getItem('my_ticket_' + storeId);

      // 只有當「同一天」且「有舊飛號」時才顯示舊飛；過日自動清除舊飛
      if (savedDate === today && savedTicket) {
        showCustomerTicket(savedTicket);
      } else {
        localStorage.removeItem('my_ticket_' + storeId);
        localStorage.removeItem('my_ticket_date_' + storeId);
        document.getElementById('ticket-form-section').classList.remove('hidden');
      }

      db.ref('stores/' + storeId).on('value', (snapshot) => {
        const sData = snapshot.val();
        if (sData) {
          document.getElementById('cust-store-name').innerText = sData.storeName;
          document.getElementById('cust-current-num').innerText = sData.currentCalled || '0000';
          document.getElementById('cust-live-called-num').innerText = sData.currentCalled || '0000';
          document.getElementById('cust-next-num').innerText = calculateNextTicketNum(sData.lastIssued || '0000');

          const allowed = isTimeAllowed(sData.startTime, sData.endTime);
          if (!allowed) {
            document.getElementById('closed-msg').classList.remove('hidden');
            document.getElementById('form-body').classList.add('hidden');
          } else {
            document.getElementById('closed-msg').classList.add('hidden');
            document.getElementById('form-body').classList.remove('hidden');
          }
        }
      });
    }

    function showCustomerTicket(ticketNum) {
      document.getElementById('ticket-form-section').classList.add('hidden');
      document.getElementById('ticket-result-section').classList.remove('hidden');
      document.getElementById('my-ticket-num').innerText = ticketNum;
    }

    function submitTakeTicket() {
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const partySize = document.getElementById('party-size').value;

      if (!phone || phone.length < 8) {
        alert('請輸入有效的8位電話號碼');
        return;
      }

      db.ref('stores/' + storeId).transaction((current) => {
        if (!current) return current;

        const allowed = isTimeAllowed(current.startTime, current.endTime);
        if (!allowed) return;

        const newNum = calculateNextTicketNum(current.lastIssued || '0000');
        current.lastIssued = newNum;

        if (!current.tickets) current.tickets = [];
        current.tickets.push({
          ticketNum: newNum,
          name: name,
          phone: phone,
          partySize: partySize,
          time: new Date().toLocaleTimeString('zh-HK', { hour12: false, hour: '2-digit', minute: '2-digit' }),
          status: 'waiting'
        });

        return current;
      }, (error, committed, snapshot) => {
        if (committed) {
          const val = snapshot.val();
          const newIssued = val.lastIssued;
          const today = new Date().toISOString().split('T')[0];
          
          // 儲存飛號與當日日期到客人手機瀏覽器
          localStorage.setItem('my_ticket_' + storeId, newIssued);
          localStorage.setItem('my_ticket_date_' + storeId, today);
          
          showCustomerTicket(newIssued);
        } else {
          alert('拎飛失敗，可能目前非營業拎飛時間');
        }
      });
    }
  </script>
</body>
</html>
